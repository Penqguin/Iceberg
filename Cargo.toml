[package]
name = "iceberg"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4", "js"] }
console_error_panic_hook = "0.1.7"
futures = "0.3"
regex = "1.10"
once_cell = "1.18"

[features]
# Enables the shared test-fixture builders for the criterion bench target
# (run: `cargo bench --features bench`); lib unit tests see them via cfg(test).
bench = []

[dev-dependencies]
mockito = "1.2"
tokio = { version = "1.0", features = ["full", "test-util"] }
criterion = "0.5"

[[bench]]
name = "performance"
harness = false
required-features = ["bench"]
