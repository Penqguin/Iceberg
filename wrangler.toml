name = "iceberg"
main = "build/index.js"
compatibility_date = "2024-04-05"

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
# Warmer skips entries that already exist (TTL 3600s), so the cron frequency
# only controls how often we check, not how often we fetch. Keeps the
# portfolio's exact query (limit=5, history_limit=70, langs=3) warm almost
# continuously; a GitHub-backed miss at most once per hour.
crons = ["*/5 * * * *"]

[env.production]
vars = { WHITELIST = "penqguin" }
# Add production-specific settings here (route, zone_id, etc.)
# Example: route = "example.com/*"
